antora:
  extensions:
    - '@antora/collector-extension'
site:
  title: Hamoni Platform
  start_page: hamoni::index.adoc
content:
  sources:
    - url: ..
      start_path: docs
      branches: HEAD
ui:
  bundle:
    url: ./ui
    snapshot: true
asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    allow-uri-read: true
    kroki-default-format: svg
    kroki-default-options: inline