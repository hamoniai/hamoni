# Main properties
# Include all properties as the main version first, with environment overrides listed below.
quarkus.application.name=hamoni-control-room
# Quinoa frontend properties
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=24.21.0
quarkus.quinoa.package-manager-install.npm-version=provided
quarkus.quinoa.package-manager-install.install-dir=../control-room-ui/build
quarkus.quinoa.ui-dir=../control-room-ui
quarkus.quinoa.ui-root-path=/
quarkus.quinoa.package-manager-command.dev=run start:staging
# Build properties (some may need setting on the command line, but documented here)
quarkus.container-image.additional-tags=latest
quarkus.container-image.build=true
quarkus.container-image.builder=docker
quarkus.docker.buildx.platform=linux/arm64
quarkus.native.container-build=true
#quarkus.native.additional-build-args=-O0
quarkus.native.enabled=true
quarkus.native.native-image-xmx=8g
quarkus.package.jar.enabled=false
quarkus.container-image.push=true
# Database properties
# Database - Disable Hibernate blocking ORM. Need to do this as it autodetects the JDBC driver.
quarkus.hibernate-orm.jdbc.enabled=false
# Database - Connections. Use H2 as the test database. Need to specify reactive (for Panache) and non-reactive (for Flyway)
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/tbc?sslMode=VERIFY_IDENTITY
quarkus.datasource.reactive.url=vertx-reactive:mysql://localhost:3306/tbc?sslMode=VERIFY_IDENTITY
%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:unittest;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%dev.quarkus.datasource.reactive.url=vertx-reactive:h2:mem:unittest;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:unittest;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.reactive.url=vertx-reactive:h2:mem:unittest;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Database - RDS IAM login. Database name is 'platform'
#%prod.quarkus.datasource.password=db_iam_user
#%prod.quarkus.datasource.credentials-provider=platform
#%prod.quarkus.rds.credentials-provider.platform.use-quarkus-client=true
#%prod.quarkus.rds.credentials-provider.platform.username=db_iam_user
#%prod.quarkus.rds.credentials-provider.platform.hostname=your-aurora-cluster.cluster-xyz.us-east-1.rds.amazonaws.com
#%prod.quarkus.rds.credentials-provider.platform.port=5432
# Database - Vert.x metadata is not implemented for databases.
quarkus.hibernate-orm.database.version-check.enabled=false
# Database - Flyway specific properties. For Flyway, we have to create a default global config, which contains all
#            source files because the build time config only takes the confg from the global (no data source on the
#            others). The migration is all set to false as we need to handle manually. The 'platform' and
#            'organisation' are the real schema updated, though the 'organisation' schema is dynamically updated.
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.clean-at-start=false
quarkus.flyway.create-schemas=true
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=classpath:db/migration/platform,classpath:db/migration/organisation
quarkus.flyway."organisation".baseline-on-migrate=false
quarkus.flyway."organisation".clean-at-start=false
quarkus.flyway."organisation".create-schemas=true
quarkus.flyway."organisation".migrate-at-start=false
quarkus.flyway."organisation".locations=classpath:db/migration/organisation/${quarkus.datasource.db-kind},classpath:db/migration/organisation/common
quarkus.flyway."platform".baseline-on-migrate=false
quarkus.flyway."platform".clean-at-start=false
quarkus.flyway."platform".create-schemas=true
quarkus.flyway."platform".default-schema=platform
quarkus.flyway."platform".migrate-at-start=false
quarkus.flyway."platform".schemas=platform
quarkus.flyway."platform".locations=classpath:db/migration/platform/${quarkus.datasource.db-kind},classpath:db/migration/platform/common
# During development the current schema is generated into the build directory, while a previous released
# version may still be on the classpath. Flyway reads both: the generated version and the last deployed one.
%dev.quarkus.flyway.locations=filesystem:build/generated/schema/platform,classpath:db/migration/platform,filesystem:build/generated/schema/organisation,classpath:db/migration/organisation
%dev.quarkus.flyway."organisation".locations=filesystem:build/generated/schema/organisation/${quarkus.datasource.db-kind},filesystem:build/generated/schema/organisation/common,classpath:db/migration/organisation/${quarkus.datasource.db-kind},classpath:db/migration/organisation/common
%dev.quarkus.flyway."platform".locations=filesystem:build/generated/schema/platform/${quarkus.datasource.db-kind},filesystem:build/generated/schema/platform/common,classpath:db/migration/platform/${quarkus.datasource.db-kind},classpath:db/migration/platform/common
# Database - Hibernate specific properties
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.log-session-metrics=true
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.metrics.enabled=true
quarkus.hibernate-orm.multitenant=SCHEMA
quarkus.hibernate-orm.physical-naming-strategy=ai.hamoni.control_room.PhysicalNamingStrategyTenantQualifyingSnakeCaseImpl
quarkus.hibernate-orm.quote-identifiers.strategy=all-except-column-definitions
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.statistics=true
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.validate-in-dev-mode=false
hibernate.order_inserts=true
# REST properties
quarkus.rest.path=/api
quarkus.rest.exception-mapping.disable-mapper-for=io.quarkus.resteasy.reactive.jackson.runtime.mappers.BuiltinMismatchedInputExceptionMapper
quarkus.hibernate-validator.method-validation.allow-overriding-parameter-constraints=true
# Authentication - OIDC authorization code flow with an encrypted session cookie.
#                  Hybrid mode lets a browser authenticate from the session cookie while a machine
#                  caller may still present a bearer token. The client id/secret are supplied by
#                  Keycloak Dev Services in development. Tokens are not required, so do not store.
#                  In test mode, dev services is disabled as using @TestSecurity.
#                  Need to disable proactive auth because of a conflict with the tenant resolver.
#                  https://quarkus.io/guides/security-openid-connect-code-flow-authentication/
#                  https://quarkus.io/guides/security-openid-connect-dev-services/
#                  https://quarkus.io/guides/security-oidc-configuration-properties-reference/
quarkus.http.auth.proactive=false
quarkus.oidc.application-type=hybrid
quarkus.oidc.authentication.cookie-path=/
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.authentication.redirect-path=/api/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.token-state-manager.strategy=id-token
# Authentication - dev mode specific configuration for OIDC and dev services
%dev.quarkus.keycloak.devservices.realm-path=devmode/quarkus-realm.json
%dev.quarkus.oidc.authentication.scopes=profile,email
# Authentication - test mode - disable dev services because tests use @TestSecurity. For production, this must not
#                  be set otherwise it will cause all non-authenticated requests to be forwarded over to that
#                  provider, potentially leaking a lot of information. In dev mode it is enabled for Keycloak.
quarkus.oidc.tenant-enabled=false
%dev.quarkus.oidc.tenant-enabled=true
# Hamoni specific properties for testing
%dev.hamoni.platform.default-organisation.config=devmode/organisation-init.json
%dev.hamoni.platform.default-organisation.id=${quarkus.uuid}
%test.hamoni.platform.default-organisation.id=${quarkus.uuid}
# Temp for debugging
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.hibernate-orm.log.format-sql=true
# Schema export command profile. Activate it after the dev profile so that its settings win, for example:
#   ./gradlew :control-room:quarkusDev -Dquarkus.profile=dev,schema-export
# The destination path is configured here because Gradle prefixes provider values passed as system properties.
%schema-export.hamoni.schema-export.output-directory=build/generated/schema
%schema-export.quarkus.console.enabled=false
# The blocking Hibernate side is enabled in this profile to expose SessionFactory/SchemaManager to the command. The JDBC
# datasource and pool are not used: the DDL is generated to a script, not applied to a database.
%schema-export.quarkus.datasource.jdbc.active=false
%schema-export.quarkus.datasource.jdbc.pooling-enabled=false
%schema-export.quarkus.devservices.enabled=false
%schema-export.quarkus.flyway.enabled=false
%schema-export.quarkus.hibernate-orm.database.version-check.enabled=false
%schema-export.quarkus.hibernate-orm.jdbc.enabled=true
%schema-export.quarkus.hibernate-orm.multitenant=
%schema-export.quarkus.hibernate-orm.physical-naming-strategy=ai.hamoni.control_room.PhysicalNamingSchemaErasingSnakeCaseImpl
%schema-export.quarkus.hibernate-orm.schema-management.create-schemas=false
%schema-export.quarkus.hibernate-orm.schema-management.halt-on-error=true
%schema-export.quarkus.hibernate-orm.schema-management.strategy=none
%schema-export.quarkus.hibernate-orm.scripts.generation=none
%schema-export.quarkus.http.host-enabled=false
%schema-export.quarkus.keycloak.devservices.enabled=false
%schema-export.quarkus.live-reload.enabled=false
%schema-export.quarkus.oidc.tenant-enabled=false
%schema-export.quarkus.quinoa=false
%schema-export.quarkus.scheduler.enabled=false
%schema-export.quarkus.test.continuous-testing=disabled
# H2 is used for both exports. The MariaDB profile runs H2 in MariaDB compatibility mode and forces the MariaDB
# dialect, so the generated DDL matches MariaDB without a running MariaDB server.
%schema-export-h2.hamoni.schema-export.db-kind=${quarkus.datasource.db-kind}
%schema-export-h2.quarkus.datasource.db-kind=h2
%schema-export-h2.quarkus.datasource.jdbc.url=jdbc:h2:mem:x;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%schema-export-h2.quarkus.hibernate-orm.dialect=org.hibernate.dialect.H2Dialect
%schema-export-mariadb.hamoni.schema-export.db-kind=mariadb
%schema-export-mariadb.quarkus.datasource.db-kind=h2
%schema-export-mariadb.quarkus.datasource.jdbc.url=jdbc:h2:mem:x;MODE=MariaDB;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%schema-export-mariadb.quarkus.hibernate-orm.dialect=org.hibernate.dialect.MariaDBDialect