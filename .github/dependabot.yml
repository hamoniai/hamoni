version: 2
updates:
  # Configuration for npm packages (Node.js)
  - package-ecosystem: "npm"
    open-pull-requests-limit: 10
    directory: "/control-room/control-room-ui"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      angular:
        applies-to: version-updates
        patterns:
          - "@angular*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "angular"
  # Configuration for Java packages (Gradle)
  - package-ecosystem: "gradle"
    open-pull-requests-limit: 10
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "java"
